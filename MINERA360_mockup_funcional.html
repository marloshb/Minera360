<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MINERA 360 — Plataforma Integrada de Inteligência, Supervisão e Gestão de Riscos da Mineração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.30/"></script>
<style>
/* ============================================================
   MINERA 360 — Design System "Instrumento"
   Menu lateral escuro (sala de controle) + área de trabalho clara
   Cor orientada a estado, nunca decoração.
   ============================================================ */
:root{
  /* superfícies */
  --ink:#0A1620;          /* casco da sala de controle */
  --ink-2:#0F2130;
  --ink-3:#16303F;
  --ink-line:#1E3A4C;
  --paper:#EEF1F3;        /* área de trabalho */
  --surface:#FFFFFF;
  --surface-2:#F7F9FA;
  --line:#DCE3E7;
  --line-2:#C7D2D8;

  /* tipografia */
  --t1:#0B1E2A;
  --t2:#42606F;
  --t3:#7C949F;
  --on-dark-1:#E7EFF3;
  --on-dark-2:#8FAAB9;
  --on-dark-3:#5C7B8C;

  /* estado — padrão institucional MINERA 360 */
  --st-normal:#12855A;
  --st-atencao:#C98A00;
  --st-alerta:#DC6803;
  --st-critico:#C4162B;
  --st-semdados:#7C949F;
  --st-info:#0E6E8C;

  --st-normal-bg:#E4F4EC;
  --st-atencao-bg:#FBF1D8;
  --st-alerta-bg:#FCEEE0;
  --st-critico-bg:#FBE6E8;
  --st-semdados-bg:#EDF1F3;
  --st-info-bg:#E2F0F5;

  /* institucional / IA */
  --accent:#0E6E8C;       /* azul-instrumento */
  --accent-d:#0A5570;
  --ai:#6D3FBF;           /* violeta reservado a inferência de IA */
  --ai-bg:#F1EBFC;
  --ai-line:#D9C9F5;

  --r:6px; --r-lg:10px;
  --sh:0 1px 2px rgba(11,30,42,.07), 0 2px 8px rgba(11,30,42,.05);
  --sh-lg:0 8px 32px rgba(11,30,42,.16);

  --nav-w:244px; --insp-w:352px; --top-h:52px; --live-h:34px;
  --f-ui:'IBM Plex Sans',system-ui,sans-serif;
  --f-cond:'IBM Plex Sans Condensed',var(--f-ui);
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--t1);
  font-family:var(--f-ui);font-size:13px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C2CFD6;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#A6B8C1}
::-webkit-scrollbar-track{background:transparent}
.dark ::-webkit-scrollbar-thumb{background:#1E3A4C}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ===================== SHELL ===================== */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{
  height:var(--top-h);flex:0 0 auto;background:var(--ink);color:var(--on-dark-1);
  display:flex;align-items:center;gap:14px;padding:0 14px;
  border-bottom:1px solid var(--ink-line);z-index:60;position:relative;
}
.brand{display:flex;align-items:center;gap:9px;padding-right:14px;border-right:1px solid var(--ink-line);height:100%}
.brand .mark{width:26px;height:26px;flex:0 0 auto}
.brand .nm{font-family:var(--f-cond);font-weight:700;font-size:16px;letter-spacing:.055em;line-height:1}
.brand .nm b{color:#4FD1C5;font-weight:700}
.brand .sub{font-size:8.5px;letter-spacing:.16em;color:var(--on-dark-3);text-transform:uppercase;margin-top:2px}
.ctx{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--on-dark-2)}
.ctx select{
  background:var(--ink-2);border:1px solid var(--ink-line);color:var(--on-dark-1);
  border-radius:var(--r);padding:4px 7px;font-size:11px;
}
.gsearch{flex:1;max-width:560px;position:relative}
.gsearch input{
  width:100%;background:var(--ink-2);border:1px solid var(--ink-line);color:var(--on-dark-1);
  border-radius:var(--r);padding:7px 11px 7px 32px;font-size:12px;
}
.gsearch input::placeholder{color:var(--on-dark-3)}
.gsearch input:focus{border-color:var(--ai);background:#101C2B}
.gsearch .ic{position:absolute;left:10px;top:7px;color:var(--ai);font-size:12px}
.gsearch .kbd{position:absolute;right:8px;top:7px;font-family:var(--f-mono);font-size:9.5px;color:var(--on-dark-3);border:1px solid var(--ink-line);border-radius:3px;padding:1px 4px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbtn{
  display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:var(--r);
  color:var(--on-dark-2);font-size:11.5px;border:1px solid transparent;
}
.tbtn:hover{background:var(--ink-2);color:var(--on-dark-1)}
.tbtn.on{background:var(--ink-3);color:#fff;border-color:var(--ink-line)}
.tbtn .badge{background:var(--st-critico);color:#fff;border-radius:9px;padding:0 5px;font-size:9.5px;font-weight:700;font-family:var(--f-mono)}
.demo-btn{background:linear-gradient(180deg,#0E6E8C,#0A5570);color:#fff;font-weight:600;padding:6px 12px;border-radius:var(--r);font-size:11.5px;display:flex;gap:7px;align-items:center;box-shadow:0 0 0 1px rgba(79,209,197,.3)}
.demo-btn.running{background:linear-gradient(180deg,#C4162B,#94101F);box-shadow:0 0 0 1px rgba(255,120,130,.4)}
.avatar{width:27px;height:27px;border-radius:50%;background:var(--ink-3);border:1px solid var(--ink-line);display:grid;place-items:center;font-size:10.5px;font-weight:700;font-family:var(--f-cond);letter-spacing:.04em;color:#8FE3D8}

.body{flex:1;display:flex;min-height:0}

/* ===================== NAV ===================== */
.sidenav{
  width:var(--nav-w);flex:0 0 auto;background:var(--ink);color:var(--on-dark-2);
  display:flex;flex-direction:column;border-right:1px solid var(--ink-line);
  overflow-y:auto;overflow-x:hidden;transition:width .16s ease;
}
.sidenav.collapsed{width:52px}
.nav-sec{padding:11px 13px 4px;font-family:var(--f-cond);font-size:9px;letter-spacing:.17em;color:var(--on-dark-3);text-transform:uppercase;white-space:nowrap}
.sidenav.collapsed .nav-sec{opacity:0;height:12px;padding:0}
.nav-i{
  display:flex;align-items:center;gap:10px;padding:7px 13px;margin:1px 6px;border-radius:var(--r);
  font-size:12.5px;color:var(--on-dark-2);white-space:nowrap;position:relative;
}
.nav-i:hover{background:var(--ink-2);color:var(--on-dark-1)}
.nav-i.active{background:var(--ink-3);color:#fff;font-weight:600}
.nav-i.active:before{content:"";position:absolute;left:-6px;top:6px;bottom:6px;width:3px;background:#4FD1C5;border-radius:0 3px 3px 0}
.nav-i .num{font-family:var(--f-mono);font-size:9.5px;width:15px;flex:0 0 auto;color:var(--on-dark-3);text-align:center}
.nav-i.active .num{color:#4FD1C5}
.nav-i .lbl{overflow:hidden;text-overflow:ellipsis}
.sidenav.collapsed .lbl{display:none}
.nav-i .dot{margin-left:auto;width:6px;height:6px;border-radius:50%}
.sidenav.collapsed .dot{display:none}
.nav-i .cnt{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;background:var(--ink-2);padding:1px 5px;border-radius:8px;color:var(--on-dark-2)}
.sidenav.collapsed .cnt{display:none}
.nav-foot{margin-top:auto;padding:9px;border-top:1px solid var(--ink-line)}
.persona-box{background:var(--ink-2);border:1px solid var(--ink-line);border-radius:var(--r);padding:8px}
.sidenav.collapsed .persona-box{display:none}
.persona-box label{font-family:var(--f-cond);font-size:8.5px;letter-spacing:.15em;color:var(--on-dark-3);text-transform:uppercase;display:block;margin-bottom:4px}
.persona-box select{width:100%;background:var(--ink-3);border:1px solid var(--ink-line);color:var(--on-dark-1);border-radius:4px;padding:4px 6px;font-size:11px}

/* ===================== WORKSPACE ===================== */
.workspace{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.mod-head{
  flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px 18px;display:flex;align-items:center;gap:14px;
}
.mod-head h1{margin:0;font-family:var(--f-cond);font-size:17px;font-weight:700;letter-spacing:.005em;white-space:nowrap}
.mod-head .kicker{font-family:var(--f-cond);font-size:9px;letter-spacing:.18em;color:var(--t3);text-transform:uppercase;display:block;margin-bottom:1px}
.mod-head .goal{font-size:11.5px;color:var(--t2);max-width:620px;border-left:1px solid var(--line);padding-left:14px}
.mod-actions{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tabs{flex:0 0 auto;display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--line);padding:0 18px;overflow-x:auto}
.tab{padding:7px 13px;font-size:12px;color:var(--t2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--t1);background:var(--surface-2)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.mod-body{flex:1;overflow:auto;padding:14px 18px 22px;min-height:0}
.mod-body.flush{padding:0;overflow:hidden}

/* ===================== ELEMENTOS ===================== */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--surface);font-size:11.5px;font-weight:500;color:var(--t1);
}
.btn:hover{background:var(--surface-2);border-color:var(--t3)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{background:var(--accent-d)}
.btn.d{background:var(--st-critico);border-color:var(--st-critico);color:#fff}
.btn.d:hover{filter:brightness(.92)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.ai:hover{filter:brightness(1.08)}
.btn.gh{background:transparent;border-color:transparent;color:var(--t2)}
.btn.gh:hover{background:var(--surface-2);color:var(--t1)}
.btn.sm{padding:3px 8px;font-size:10.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-h{padding:9px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.card-h h3{margin:0;font-family:var(--f-cond);font-size:12.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.card-h .sub{font-size:10.5px;color:var(--t3)}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:13px}
.card-b.p0{padding:0}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1fr 2fr}
.g31{grid-template-columns:3fr 1fr}
@media(max-width:1500px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
@media(max-width:1400px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);padding:9px 12px;cursor:pointer;position:relative;transition:background .12s}
.kpi:hover{background:var(--surface-2)}
.kpi .lb{font-family:var(--f-cond);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);display:block;line-height:1.25;min-height:20px}
.kpi .vl{font-family:var(--f-cond);font-size:23px;font-weight:700;line-height:1.15;letter-spacing:-.01em;display:flex;align-items:baseline;gap:5px}
.kpi .vl small{font-size:12px;font-weight:500;color:var(--t3)}
.kpi .dl{font-size:10px;font-family:var(--f-mono);display:flex;align-items:center;gap:3px}
.kpi.crit .vl{color:var(--st-critico)}
.kpi.warn .vl{color:var(--st-alerta)}
.kpi.ok .vl{color:var(--st-normal)}
.kpi .flash{position:absolute;inset:0;background:rgba(196,22,43,.14);opacity:0;pointer-events:none}
@keyframes flashkpi{0%{opacity:1}100%{opacity:0}}
.kpi.flashing .flash{animation:flashkpi 1.1s ease-out}

/* status chips */
.st{display:inline-flex;align-items:center;gap:5px;padding:1.5px 7px;border-radius:20px;font-size:10px;font-weight:600;font-family:var(--f-cond);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.st:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.st.normal{background:var(--st-normal-bg);color:var(--st-normal)}
.st.atencao{background:var(--st-atencao-bg);color:var(--st-atencao)}
.st.alerta{background:var(--st-alerta-bg);color:var(--st-alerta)}
.st.critico{background:var(--st-critico-bg);color:var(--st-critico)}
.st.semdados{background:var(--st-semdados-bg);color:var(--st-semdados)}
.st.info{background:var(--st-info-bg);color:var(--st-info)}
.st.sq{border-radius:3px}
.st.ai{background:var(--ai-bg);color:var(--ai)}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);font-size:10px;color:var(--t2);font-family:var(--f-mono)}
.tag.demo{background:#FFF6E5;border-color:#F0DCAE;color:#8A6100;font-family:var(--f-cond);letter-spacing:.1em;font-size:8.5px;font-weight:700;padding:1px 5px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--t3)}
.tiny{font-size:10.5px}
.lbl{font-family:var(--f-cond);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);display:block}

/* tabelas */
table.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
table.tbl th{
  text-align:left;font-family:var(--f-cond);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--t3);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);
  background:var(--surface-2);position:sticky;top:0;z-index:2;white-space:nowrap;cursor:pointer;user-select:none;
}
table.tbl th:hover{color:var(--t1)}
table.tbl th.nos{cursor:default}
table.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover{background:#F2F8FA}
table.tbl tbody tr.sel{background:#E2F0F5;box-shadow:inset 3px 0 0 var(--accent)}
table.tbl tbody tr.new{animation:rowin .9s ease-out}
@keyframes rowin{0%{background:#FDF3D6}100%{background:transparent}}
.tbl-wrap{overflow:auto;max-height:100%}
.num{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}

/* toolbar de filtro */
.ftbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:8px 13px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.ftbar input[type=text],.ftbar select{border:1px solid var(--line-2);border-radius:var(--r);padding:4px 8px;font-size:11.5px;background:var(--surface)}
.ftbar input[type=text]{min-width:180px}
.chipf{padding:3px 9px;border-radius:20px;border:1px solid var(--line-2);background:var(--surface);font-size:10.5px;font-weight:500;color:var(--t2)}
.chipf.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* mapa */
.map-shell{position:relative;width:100%;height:100%;background:#DDE5E9}
.map-el{position:absolute;inset:0}
.map-ov{position:absolute;z-index:20;pointer-events:none}
.map-ov>*{pointer-events:auto}
.map-legend{
  left:11px;bottom:11px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 10px;box-shadow:var(--sh);backdrop-filter:blur(4px);
}
.map-legend .lg{display:flex;align-items:center;gap:6px;font-size:10.5px;margin-top:3px}
.map-legend .sw{width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.layer-panel{
  right:11px;top:11px;width:214px;background:rgba(255,255,255,.97);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;
}
.layer-panel .lh{padding:6px 9px;border-bottom:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center}
.layer-panel .li{display:flex;align-items:center;gap:7px;padding:4px 9px;font-size:11px;border-bottom:1px solid #F0F3F5}
.layer-panel .li:last-child{border:0}
.layer-panel input[type=checkbox]{accent-color:var(--accent);margin:0}
.layer-panel .src{margin-left:auto;font-size:8.5px;font-family:var(--f-cond);letter-spacing:.08em;color:var(--t3);text-transform:uppercase}
.map-loading{position:absolute;inset:0;display:grid;place-items:center;background:#E7EDF0;z-index:5;font-size:11.5px;color:var(--t2)}
.esri-popup__header-title{font-family:var(--f-cond)!important}
.esri-view .esri-attribution{font-size:9px}

/* inspector */
.inspector{
  width:var(--insp-w);flex:0 0 auto;background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
}
.inspector.hidden{display:none}
.insp-h{padding:9px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FAFCFD,#F4F7F9)}
.insp-h .ttl{font-family:var(--f-cond);font-size:12.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.insp-b{flex:1;overflow-y:auto}
.insp-sec{padding:11px 13px;border-bottom:1px solid var(--line)}
.insp-sec h4{margin:0 0 7px;font-family:var(--f-cond);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);font-weight:600;display:flex;align-items:center;gap:6px}
.ai-sec{background:linear-gradient(180deg,#FBF9FF,#F6F2FE);border-bottom:1px solid var(--ai-line)}
.ai-sec h4{color:var(--ai)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:2.5px 0;font-size:11.5px;border-bottom:1px dotted #E8EDF0}
.kv:last-child{border:0}
.kv .k{color:var(--t2);flex:0 0 auto}
.kv .v{font-family:var(--f-mono);font-weight:500;text-align:right;font-size:11px}
.conf{display:flex;align-items:center;gap:7px;font-size:10.5px}
.conf .bar{flex:1;height:5px;background:#E7E0F5;border-radius:3px;overflow:hidden}
.conf .bar i{display:block;height:100%;background:var(--ai)}

/* barra de progresso genérica */
.pbar{height:5px;background:#E6ECEF;border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;transition:width .5s ease}

/* live footer */
.livebar{
  height:var(--live-h);flex:0 0 auto;background:var(--ink);border-top:1px solid var(--ink-line);
  color:var(--on-dark-2);display:flex;align-items:center;gap:16px;padding:0 14px;font-size:11px;z-index:50;
}
.livebar .grp{display:flex;align-items:center;gap:6px;white-space:nowrap}
.livebar .sep{width:1px;height:15px;background:var(--ink-line)}
.pulse{width:7px;height:7px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.pulse.paused{background:var(--st-atencao);animation:none}
.livebar .mv{font-family:var(--f-mono);color:#4FD1C5}
.ticker{flex:1;overflow:hidden;position:relative;height:100%;display:flex;align-items:center;min-width:0}
.ticker-in{display:flex;gap:26px;white-space:nowrap;animation:tick 46s linear infinite}
@keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker span{font-family:var(--f-mono);font-size:10.5px;color:var(--on-dark-2)}
.livebar .lb-btn{color:var(--on-dark-2);padding:3px 8px;border-radius:4px;border:1px solid var(--ink-line);font-size:10.5px}
.livebar .lb-btn:hover{background:var(--ink-2);color:#fff}
.livebar .lb-btn.on{background:var(--ink-3);color:#fff}

/* feed de eventos */
.feed{overflow-y:auto}
.fev{display:flex;gap:9px;padding:7px 12px;border-bottom:1px solid #F0F3F5;cursor:pointer;font-size:11.5px;align-items:flex-start}
.fev:hover{background:#F2F8FA}
.fev.new{animation:rowin 1.1s ease-out}
.fev .tm{font-family:var(--f-mono);font-size:10px;color:var(--t3);flex:0 0 52px;padding-top:1px}
.fev .ico{flex:0 0 16px;text-align:center;font-size:11px;padding-top:1px}
.fev .tx{flex:1;min-width:0}
.fev .tx b{font-weight:600}
.fev .mt{font-size:10px;color:var(--t3);font-family:var(--f-mono);margin-top:1px}

/* fila de decisão */
.dq{border-bottom:1px solid var(--line);padding:10px 13px;display:flex;gap:10px;align-items:flex-start}
.dq:hover{background:var(--surface-2)}
.dq .bd{flex:1;min-width:0}
.dq .ttl{font-weight:600;font-size:12.5px;margin-bottom:2px}
.dq .rec{font-size:11px;color:var(--t2);margin-bottom:6px}
.dq .acts{display:flex;gap:5px;flex-wrap:wrap}
.dq .prio{width:3px;border-radius:3px;align-self:stretch;flex:0 0 3px}

/* timeline */
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1.5px;background:var(--line)}
.tl-i{position:relative;padding:0 0 12px}
.tl-i:before{content:"";position:absolute;left:-18px;top:4px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--line-2)}
.tl-i.on:before{border-color:var(--accent);background:var(--accent)}
.tl-i.crit:before{border-color:var(--st-critico);background:var(--st-critico)}
.tl-i .tt{font-size:11.5px;font-weight:600}
.tl-i .dd{font-size:10.5px;color:var(--t3);font-family:var(--f-mono)}

/* workflow */
.wf{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 0}
.wf-s{
  flex:1;min-width:104px;background:var(--surface-2);border:1px solid var(--line);
  padding:7px 9px 7px 16px;position:relative;font-size:11px;
}
.wf-s:not(:last-child){margin-right:9px}
.wf-s:after{
  content:"";position:absolute;right:-10px;top:50%;transform:translateY(-50%);z-index:2;
  border-left:9px solid var(--surface-2);border-top:17px solid transparent;border-bottom:17px solid transparent;
}
.wf-s:not(:last-child):before{
  content:"";position:absolute;right:-11px;top:50%;transform:translateY(-50%);z-index:1;
  border-left:9px solid var(--line);border-top:18px solid transparent;border-bottom:18px solid transparent;
}
.wf-s .n{font-family:var(--f-mono);font-size:8.5px;color:var(--t3)}
.wf-s .t{font-weight:600;font-size:10.5px;line-height:1.25}
.wf-s.done{background:#E4F4EC;border-color:#B9E2CE}
.wf-s.done:after{border-left-color:#E4F4EC}
.wf-s.cur{background:var(--ink);border-color:var(--ink);color:#fff}
.wf-s.cur:after{border-left-color:var(--ink)}
.wf-s.cur .n{color:#4FD1C5}

/* agentes */
.ag{display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1px solid #F0F3F5;font-size:11.5px;cursor:pointer}
.ag:hover{background:#F2F8FA}
.ag .ic{width:24px;height:24px;border-radius:5px;background:var(--ai-bg);color:var(--ai);display:grid;place-items:center;font-size:11px;flex:0 0 auto}
.ag .nm{font-weight:600}
.ag .ls{font-size:10px;color:var(--t3);font-family:var(--f-mono)}
.ag.busy .ic{animation:agp .9s infinite}
@keyframes agp{0%,100%{background:var(--ai-bg)}50%{background:#DCC8FA}}
.runlog{font-family:var(--f-mono);font-size:10.5px;white-space:pre-wrap;background:#0A1620;color:#B8D4E0;border-radius:var(--r);padding:9px 11px;max-height:210px;overflow-y:auto;line-height:1.65}
.runlog .t{color:#4A6C7D}
.runlog .ok{color:#4ADE80}
.runlog .wr{color:#FBBF24}
.runlog .er{color:#F87171}
.runlog .hl{color:#7DD3FC}

/* proof / blockchain */
.proof{background:#F5FBFC;border:1px solid #C9E5EC;border-radius:var(--r);padding:9px 11px;font-family:var(--f-mono);font-size:10.5px}
.proof .pl{display:flex;justify-content:space-between;padding:1.5px 0}
.proof .ok{color:var(--st-normal);font-weight:600}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(10,22,32,.55);z-index:200;display:grid;place-items:center;padding:24px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;max-width:900px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal.sm{max-width:520px}
.modal.lg{max-width:1180px}
.modal-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{margin:0;font-family:var(--f-cond);font-size:15px;font-weight:700;letter-spacing:.02em}
.modal-b{padding:16px;overflow-y:auto;flex:1}
.modal-f{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2)}
.x{margin-left:auto;font-size:17px;color:var(--t3);line-height:1;padding:2px 6px;border-radius:4px}
.x:hover{background:var(--surface-2);color:var(--t1)}

/* formulários */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-family:var(--f-cond);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--t3)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);border-radius:var(--r);padding:5px 8px;font-size:12px;background:var(--surface);width:100%}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
.fld .hint{font-size:10px;color:var(--t3)}
.fset{border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-bottom:11px}
.fset legend{font-family:var(--f-cond);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);padding:0 6px;font-weight:600}
.ai-fill{border:1px dashed var(--ai-line);background:var(--ai-bg);border-radius:var(--r);padding:7px 9px;font-size:11px;color:#4A2A85;display:flex;gap:8px;align-items:center}

/* toast */
.toasts{position:fixed;right:16px;bottom:46px;z-index:300;display:flex;flex-direction:column;gap:7px;max-width:370px}
.toast{background:var(--ink);color:var(--on-dark-1);border-radius:var(--r);padding:9px 13px;font-size:11.5px;box-shadow:var(--sh-lg);border-left:3px solid var(--accent);animation:tin .25s ease-out}
.toast.ok{border-left-color:var(--st-normal)}
.toast.warn{border-left-color:var(--st-alerta)}
.toast.crit{border-left-color:var(--st-critico)}
.toast.ai{border-left-color:var(--ai)}
.toast b{display:block;font-family:var(--f-cond);letter-spacing:.03em;margin-bottom:1px}
@keyframes tin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}

/* signature: cadeia viva */
.chain{display:flex;align-items:stretch;gap:0;background:var(--ink);border-radius:var(--r-lg);overflow:hidden;position:relative}
.chain-s{flex:1;padding:7px 6px 8px;text-align:center;position:relative;color:var(--on-dark-3);border-right:1px solid rgba(255,255,255,.06);cursor:pointer}
.chain-s:last-child{border-right:0}
.chain-s .cn{font-family:var(--f-mono);font-size:8px;opacity:.6;display:block}
.chain-s .ct{font-family:var(--f-cond);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:600}
.chain-s:hover{background:rgba(255,255,255,.05);color:var(--on-dark-1)}
.chain-s.hot{color:#fff;background:rgba(79,209,197,.14)}
.chain-s.hot .ct{color:#4FD1C5}
.chain-s .spark{position:absolute;left:0;right:0;bottom:0;height:2px;background:#4FD1C5;transform:scaleX(0);transform-origin:left}
.chain-s.hot .spark{animation:sp 1.4s ease-out}
@keyframes sp{0%{transform:scaleX(0);opacity:1}100%{transform:scaleX(1);opacity:.15}}

/* replay */
.replay{display:flex;align-items:center;gap:11px;padding:7px 13px;background:#0F2130;color:var(--on-dark-1);border-radius:var(--r);font-size:11px}
.replay input[type=range]{flex:1;accent-color:#4FD1C5}
.tt{position:relative;cursor:help;border-bottom:1px dotted var(--t3)}

/* utilidades */
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.sp{margin-left:auto}
.hstack{display:flex;gap:12px}
.vstack{display:flex;flex-direction:column;gap:12px}
.h100{height:100%}
.split{display:flex;height:100%;min-height:0}
.split>.l{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.split>.r{width:400px;flex:0 0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
.scroll{overflow-y:auto;min-height:0}
.empty{padding:26px;text-align:center;color:var(--t3);font-size:11.5px}
.sk{background:linear-gradient(90deg,#EEF2F4 25%,#E3E9EC 50%,#EEF2F4 75%);background-size:200% 100%;animation:skl 1.3s infinite;border-radius:4px}
@keyframes skl{0%{background-position:200% 0}100%{background-position:-200% 0}}
.tree{font-size:11.5px}
.tree .tn{display:flex;align-items:center;gap:6px;padding:3.5px 8px;border-radius:4px;cursor:pointer}
.tree .tn:hover{background:var(--surface-2)}
.tree .tn.sel{background:#E2F0F5;font-weight:600}
.tree .tn .ch{color:var(--t3);font-size:9px;width:9px}
.matrix td{font-size:11px}
.matrix .yes{color:var(--st-normal);font-weight:600}
.matrix .no{color:var(--st-critico);font-weight:600}
@media(max-width:1200px){.inspector{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>
<script>
/* ============================================================
   MINERA 360 — MASSA DE DADOS SINTÉTICOS (DEMO)
   Todos os dados de empresa, estrutura, risco, produção e
   incidente são SINTÉTICOS. Fontes públicas citadas apenas
   como referência de integração.
   ============================================================ */
const SEED = 360360;
let _s = SEED;
function rnd(){ _s = (_s*1664525 + 1013904223) % 4294967296; return _s/4294967296; }
function ri(a,b){ return Math.floor(rnd()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function pickw(pairs){ // [[val,peso]]
  const tot = pairs.reduce((s,p)=>s+p[1],0); let r = rnd()*tot;
  for(const [v,w] of pairs){ if((r-=w)<=0) return v; } return pairs[0][0];
}
const pad = (n,l=3)=>String(n).padStart(l,'0');
const fmt = n => n.toLocaleString('pt-BR');
const fmt1 = n => n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmt2 = n => n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl = n => 'R$ ' + n.toLocaleString('pt-BR',{maximumFractionDigits:0});
const hhmmss = d => d.toLocaleTimeString('pt-BR',{hour12:false});
const hhmm = d => d.toLocaleTimeString('pt-BR',{hour12:false,hour:'2-digit',minute:'2-digit'});
const dmy = d => d.toLocaleDateString('pt-BR');
const dmyhm = d => dmy(d)+' '+hhmm(d);

/* ---- Geografia: Bacia do Rio Doce (MG/ES) ---- */
const MUNICIPIOS = [
  ['Mariana','MG',-20.377,-43.415],['Ouro Preto','MG',-20.385,-43.503],
  ['Congonhas','MG',-20.500,-43.858],['Itabira','MG',-19.619,-43.227],
  ['João Monlevade','MG',-19.810,-43.173],['Nova Era','MG',-19.749,-43.033],
  ['Rio Piracicaba','MG',-19.929,-43.171],['Barão de Cocais','MG',-19.947,-43.483],
  ['Santa Bárbara','MG',-19.949,-43.406],['Ipatinga','MG',-19.468,-42.537],
  ['Coronel Fabriciano','MG',-19.518,-42.629],['Timóteo','MG',-19.581,-42.644],
  ['Governador Valadares','MG',-18.851,-41.949],['Aimorés','MG',-19.497,-41.063],
  ['Baixo Guandu','ES',-19.518,-41.016],['Colatina','ES',-19.539,-40.630],
  ['Linhares','ES',-19.391,-40.072],['Resplendor','MG',-19.325,-41.254],
  ['Caratinga','MG',-19.790,-42.139],['Ipanema','MG',-19.799,-41.716],
  ['Antônio Dias','MG',-19.652,-42.874],['Bela Vista de Minas','MG',-19.822,-43.077],
  ['Catas Altas','MG',-20.075,-43.409],['Alvinópolis','MG',-20.107,-43.049],
  ['São Gonçalo do Rio Abaixo','MG',-19.827,-43.365],['Dionísio','MG',-19.837,-42.774],
  ['Marliéria','MG',-19.708,-42.723],['Naque','MG',-19.226,-42.201],
  ['Belo Oriente','MG',-19.219,-42.483],['Periquito','MG',-19.021,-42.229],
  ['Tumiritinga','MG',-18.973,-41.643],['Conselheiro Pena','MG',-19.170,-41.470],
  ['Galiléia','MG',-19.001,-41.549],['Itueta','MG',-19.397,-41.116],
  ['Marilândia','ES',-19.409,-40.542],['São Domingos do Norte','ES',-19.140,-40.622],
  ['Pancas','ES',-19.222,-40.852],['Governador Lindenberg','ES',-19.256,-40.464],
  ['Rio Bananal','ES',-19.259,-40.334],['Sooretama','ES',-19.196,-40.098],
  ['Ferros','MG',-19.234,-43.019],['Itambé do Mato Dentro','MG',-19.416,-43.363],
  ['Santana do Paraíso','MG',-19.365,-42.545],['Mesquita','MG',-19.223,-42.596],
  ['Braúnas','MG',-19.055,-42.628],['Açucena','MG',-19.070,-42.542],
  ['Sabinópolis','MG',-18.664,-43.081],['Guanhães','MG',-18.774,-42.931],
  ['Virginópolis','MG',-18.815,-42.744]
];
const OPERADORES = [
  'Mineração Horizonte S.A.','Ferrous Vale Verde Ltda.','Companhia Serra Azul',
  'Mineradora Rio Claro S.A.','Itabirito Recursos Minerais','Grupo Aurum Mineração',
  'Bandeirante Mineração S.A.','MG Ferro Participações','Vale do Aço Mineração Ltda.',
  'Cordilheira Minerais S.A.','Pedra Nova Mineração','Doce Norte Recursos'
];
const SUBSTANCIAS = ['Minério de ferro','Ouro','Bauxita','Manganês','Calcário','Rocha ornamental','Areia industrial','Grafita'];
const METODOS = ['Montante','Jusante','Linha de centro','Alteamento único'];
const STATUS = ['normal','atencao','alerta','critico','semdados'];
const ST_LABEL = {normal:'Normal',atencao:'Atenção',alerta:'Alerta',critico:'Crítico',semdados:'Sem dados'};
const ST_COLOR = {normal:'#12855A',atencao:'#C98A00',alerta:'#DC6803',critico:'#C4162B',semdados:'#7C949F'};

const DB = {
  empreendimentos:[], estruturas:[], sensores:[], comunidades:[], alertas:[],
  fiscalizacoes:[], ncs:[], evidencias:[], datasets:[], obrigacoes:[], regras:[],
  projetos:[], agentes:[], agentRuns:[], eventos:[], decisoes:[], deteccoes:[], processos:[], trechos:[],
  incidentes:[], equipes:[], apis:[], modelos:[]
};

/* ---------- Empreendimentos e estruturas ---------- */
function jitter(v,d){ return v + (rnd()-.5)*d; }
(function buildAssets(){
  const totalEmp = 286;
  for(let i=1;i<=totalEmp;i++){
    const m = MUNICIPIOS[i % MUNICIPIOS.length];
    const emp = {
      id:'MIN-'+pad(i), nome:'', operador:pick(OPERADORES), substancia:pickw([['Minério de ferro',48],['Ouro',9],['Bauxita',7],['Manganês',8],['Calcário',12],['Rocha ornamental',7],['Areia industrial',5],['Grafita',4]]),
      municipio:m[0], uf:m[1], lat:jitter(m[2],.24), lng:jitter(m[3],.26),
      status:'normal', risk:0, estruturas:[], processos:ri(3,22),
      licenca:pickw([['LO vigente',72],['LO em renovação',14],['LP/LI',9],['Suspensa',5]]),
      producaoMta: +(rnd()*14+.4).toFixed(1), empregados:ri(40,2400),
      classe:pickw([['Grande porte',18],['Médio porte',37],['Pequeno porte',45]])
    };
    emp.nome = 'Complexo ' + pick(['Horizonte','Serra Nova','Vale Verde','Pedra Alta','Rio Claro','Santa Clara','Boa Vista','Alto Doce','Cachoeira','Mata Fria','Serra Azul','Piracicaba','Guanhães','Timbó','Sete Voltas','Morro Grande']) + ' ' + pad(i);
    DB.empreendimentos.push(emp);
  }
  // Estruturas: 74 barragens, 129 pilhas, 96 cavas, 60 plantas
  const mk = (tipo,n,pref)=>{
    for(let k=1;k<=n;k++){
      const emp = DB.empreendimentos[ri(0,DB.empreendimentos.length-1)];
      const st = pickw([['normal',61],['atencao',18],['alerta',9],['critico',5],['semdados',7]]);
      const base = {normal:[22,46],atencao:[45,60],alerta:[58,74],critico:[75,95],semdados:[30,65]}[st];
      const e = {
        id:pref+'-'+pad(k), tipo, nome:'', empId:emp.id, operador:emp.operador,
        municipio:emp.municipio, uf:emp.uf, lat:jitter(emp.lat,.06), lng:jitter(emp.lng,.06),
        status:st, risk:ri(base[0],base[1]), riskPrev:0, trend:0,
        perigo:ri(20,90), exposicao:ri(15,88), vulnerabilidade:ri(20,85), capacidade:ri(35,92),
        popZAS: tipo==='barragem'? ri(0,9200): ri(0,1400),
        sensores:0, sensoresOk:0, ncAbertas:pickw([[0,58],[1,20],[2,12],[3,7],[4,3]]),
        ultimaFisc:ri(8,420), dataConf:ri(72,99),
        metodo: tipo==='barragem'? pick(METODOS): '—',
        altura: tipo==='barragem'? ri(12,92): (tipo==='pilha'? ri(20,140): ri(30,320)),
        volume: tipo==='barragem'? ri(2,140): ri(1,90),
        dce: pickw([['Válida',78],['Vencida',9],['Em análise',13]]),
        paebm: tipo==='barragem'? pickw([['Validado',74],['Em revisão',18],['Ausente',8]]) : '—',
        nivelEmerg: tipo==='barragem'? pickw([['Sem emergência',86],['Nível 1',9],['Nível 2',4],['Nível 3',1]]) : '—',
        categoriaRisco: pickw([['Baixa',52],['Média',33],['Alta',15]]),
        dpa: pickw([['Baixo',31],['Médio',33],['Alto',36]]),
        areaHa: +(rnd()*180+4).toFixed(1), areaAutorizadaHa:0,
        criadaEm: new Date(2016+ri(0,8), ri(0,11), ri(1,27))
      };
      e.areaAutorizadaHa = +(e.areaHa*(1 - rnd()*.12)).toFixed(1);
      e.riskPrev = Math.max(3, e.risk - ri(-9,11)); e.trend = e.risk - e.riskPrev;
      const nomes = {barragem:'Barragem',pilha:'Pilha',cava:'Cava',planta:'Planta'};
      e.nome = nomes[tipo]+' '+e.id;
      emp.estruturas.push(e.id);
      DB.estruturas.push(e);
    }
  };
  mk('barragem',74,'B'); mk('pilha',129,'P'); mk('cava',96,'C'); mk('planta',60,'PL');

  /* ---- Estrutura protagonista do cenário: B-017 ---- */
  const b17 = DB.estruturas.find(e=>e.id==='B-017');
  const empH = DB.empreendimentos[0];
  empH.nome='Complexo Horizonte'; empH.operador='Mineração Horizonte S.A.'; empH.municipio='Mariana'; empH.uf='MG';
  empH.lat=-19.42; empH.lng=-42.68; empH.substancia='Minério de ferro'; empH.classe='Grande porte';
  empH.licenca='LO vigente'; empH.producaoMta=12.4;
  Object.assign(b17,{
    nome:'Barragem B-017', empId:empH.id, operador:'Mineração Horizonte S.A.',
    municipio:'Mariana', uf:'MG', lat:-19.4203, lng:-42.6812,
    status:'alerta', risk:67, riskPrev:67, trend:0,
    perigo:74, exposicao:74, vulnerabilidade:69, capacidade:61,
    popZAS:4821, ncAbertas:3, ultimaFisc:112, dataConf:94,
    metodo:'Montante', altura:64, volume:38, dce:'Válida', paebm:'Validado',
    nivelEmerg:'Sem emergência', categoriaRisco:'Alta', dpa:'Alto',
    areaHa:48.6, areaAutorizadaHa:45.8, identidade:'B017-ES-MG-001'
  });
  if(!empH.estruturas.includes('B-017')) empH.estruturas.push('B-017');
  // vizinhos do complexo
  ['P-004','C-003','PL-002'].forEach((id,i)=>{
    const e = DB.estruturas.find(x=>x.id===id); if(!e) return;
    e.empId=empH.id; e.operador=empH.operador; e.municipio='Mariana'; e.uf='MG';
    e.lat=-19.4203+[.012,-.014,.02][i]; e.lng=-42.6812+[.016,.011,-.018][i];

(function buildRede(){
  const eixo=[[-43.34,-20.38],[-43.12,-20.14],[-42.98,-19.93],[-42.78,-19.71],[-42.61,-19.52],[-42.40,-19.32],
              [-42.15,-19.10],[-41.92,-18.93],[-41.64,-18.98],[-41.36,-19.08],[-41.10,-19.31],[-40.86,-19.44],
              [-40.61,-19.53],[-40.34,-19.49],[-40.07,-19.42],[-39.86,-19.55]];
  for(let i=0;i<eixo.length-1;i++){
    DB.trechos.push({nome:'Rio Doce — trecho '+pad(i+1,2), ordem:5, path:[eixo[i],eixo[i+1]],
      turbidez:ri(28,92), vazao:ri(180,1240)});
  }
  const NOMES=['Rio Piracicaba','Rio Santa Bárbara','Rio do Peixe','Rio Casca','Rio Matipó','Rio Caratinga','Rio Manhuaçu',
    'Rio Suaçuí Grande','Rio Corrente Grande','Rio Guandu','Rio Santa Maria do Doce','Rio Pancas','Rio São José',
    'Córrego do Meio','Ribeirão Boa Sorte','Córrego Santa Rita','Ribeirão do Carmo','Rio Gualaxo do Norte'];
  NOMES.forEach((n,k)=>{
    const base=eixo[Math.min(eixo.length-2, 1+ (k % (eixo.length-3)))];
    let x=base[0], y=base[1];
    const dirx=(rnd()-.5)*.5, diry=(rnd()<.5?1:-1)*.16;
    const path=[[x,y]];
    for(let j=0;j<ri(4,8);j++){ x+=dirx*.5+(rnd()-.5)*.14; y+=diry*.5+(rnd()-.5)*.12; path.push([x,y]); }
    DB.trechos.push({nome:n, ordem:ri(2,4), path, turbidez:ri(12,88), vazao:ri(8,320)});
    // afluentes menores
    for(let a=0;a<2;a++){
      const p0=path[ri(1,path.length-1)];
      const sub=[p0]; let sx=p0[0], sy=p0[1];
      for(let j=0;j<ri(2,4);j++){ sx+=(rnd()-.5)*.16; sy+=(rnd()-.5)*.16; sub.push([sx,sy]); }
      DB.trechos.push({nome:n+' — afluente '+(a+1), ordem:1, path:sub, turbidez:ri(8,70), vazao:ri(1,40)});
    }
  });
})();

function toast(title, msg, kind='', ms=4200){
  const d = document.createElement('div');
  d.className = 'toast '+kind;
  d.innerHTML = `<b>${esc(title)}</b>${msg?esc(msg):''}`;
  const box=$('#toasts'); box.appendChild(d);
  while(box.children.length>4) box.firstChild.remove();
  setTimeout(()=>{ d.style.transition='opacity .3s'; d.style.opacity='0'; setTimeout(()=>d.remove(),320); }, ms);
}

/* ---------- gráficos SVG ---------- */
function sparkline(vals,{w=110,h=26,color='#0E6E8C',fill=true,limit=null}={}){
  if(!vals||!vals.length) return '';
  const mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  const pts = vals.map((v,i)=>[i/(vals.length-1)*w, h-((v-mn)/rg)*(h-4)-2]);
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = d+` L${w} ${h} L0 ${h} Z`;
  let lim='';
  if(limit!=null && limit>=mn && limit<=mx){
    const y=h-((limit-mn)/rg)*(h-4)-2;
    lim=`<line x1="0" y1="${y.toFixed(1)}" x2="${w}" y2="${y.toFixed(1)}" stroke="#C4162B" stroke-width="1" stroke-dasharray="2 2"/>`;
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">
    ${fill?`<path d="${area}" fill="${color}" opacity=".1"/>`:''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round"/>${lim}
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2" fill="${color}"/>
  </svg>`;
}
function lineChart(series,{w=560,h=170,limit=null,labels=[],colors=['#0E6E8C','#6D3FBF','#C98A00'],yLabel=''}={}){
  const all = series.flatMap(s=>s.data);
  let mn=Math.min(...all), mx=Math.max(...all); if(limit!=null){mn=Math.min(mn,limit);mx=Math.max(mx,limit);}
  const pd=(mx-mn)*.12||1; mn-=pd; mx+=pd; const rg=mx-mn;
  const pl=44,pr=10,pt=8,pb=20, iw=w-pl-pr, ih=h-pt-pb;
  const X=i=>pl+i/(series[0].data.length-1)*iw, Y=v=>pt+ih-((v-mn)/rg)*ih;
  let g='';
  for(let i=0;i<=4;i++){ const v=mn+rg*i/4, y=Y(v);
    g+=`<line x1="${pl}" y1="${y.toFixed(1)}" x2="${w-pr}" y2="${y.toFixed(1)}" stroke="#EDF1F3"/>
        <text x="${pl-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#7C949F" font-family="IBM Plex Mono">${v.toFixed(rg<12?1:0)}</text>`; }
  let lines = series.map((s,si)=>{
    const d=s.data.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    return `<path d="${d}" fill="none" stroke="${colors[si%colors.length]}" stroke-width="1.7"/>`;
  }).join('');
  let lim = limit!=null? `<line x1="${pl}" y1="${Y(limit).toFixed(1)}" x2="${w-pr}" y2="${Y(limit).toFixed(1)}" stroke="#C4162B" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="${w-pr}" y="${(Y(limit)-4).toFixed(1)}" text-anchor="end" font-size="9" fill="#C4162B" font-family="IBM Plex Mono">limite ${limit}</text>`:'';
  let xl = labels.map((l,i)=> l? `<text x="${X(i*(series[0].data.length-1)/(labels.length-1)).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="9" fill="#7C949F" font-family="IBM Plex Mono">${l}</text>`:'').join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block">${g}${lim}${lines}${xl}
    ${yLabel?`<text x="4" y="10" font-size="8.5" fill="#7C949F" font-family="IBM Plex Sans Condensed" letter-spacing=".1em">${yLabel}</text>`:''}</svg>`;
}
function barChart(items,{w=560,h=170,color='#0E6E8C',fmtv=v=>v}={}){
  const mx=Math.max(...items.map(i=>i.v))||1, pl=8,pr=8,pt=14,pb=34, iw=w-pl-pr, ih=h-pt-pb;
  const bw=iw/items.length*.62, gap=iw/items.length;
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block">${items.map((it,i)=>{
    const bh=Math.max(2,it.v/mx*ih), x=pl+gap*i+(gap-bw)/2, y=pt+ih-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${it.c||color}" rx="2"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono" fill="#42606F">${fmtv(it.v)}</text>
      <text x="${(x+bw/2).toFixed(1)}" y="${h-12}" text-anchor="middle" font-size="9" fill="#7C949F">${esc(it.l)}</text>`;
  }).join('')}</svg>`;
}
function donut(parts,{size=118,thick=16,center=''}={}){
  const tot=parts.reduce((s,p)=>s+p.v,0)||1; const r=(size-thick)/2, c=size/2; let a=-Math.PI/2;
  const segs=parts.map(p=>{
    const ang=p.v/tot*Math.PI*2, x1=c+r*Math.cos(a), y1=c+r*Math.sin(a);
    a+=ang; const x2=c+r*Math.cos(a), y2=c+r*Math.sin(a);
    return `<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${ang>Math.PI?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" fill="none" stroke="${p.c}" stroke-width="${thick}"/>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segs}
    ${center?`<text x="${c}" y="${c+2}" text-anchor="middle" font-size="19" font-weight="700" font-family="IBM Plex Sans Condensed" fill="#0B1E2A">${center}</text>
    <text x="${c}" y="${c+15}" text-anchor="middle" font-size="8" fill="#7C949F" font-family="IBM Plex Sans Condensed" letter-spacing=".1em">TOTAL</text>`:''}</svg>`;
}
function gauge(v,{size=130,label='RISK SCORE',max=100}={}){
  const r=size/2-13, c=size/2, a0=Math.PI*0.75, a1=Math.PI*2.25;
  const col = v>=73?'#C4162B':v>=55?'#DC6803':v>=35?'#C98A00':'#12855A';
  const arc=(from,to,color,wd)=>{
    const x1=c+r*Math.cos(from), y1=c+r*Math.sin(from), x2=c+r*Math.cos(to), y2=c+r*Math.sin(to);
    return `<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${to-from>Math.PI?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" fill="none" stroke="${color}" stroke-width="${wd}" stroke-linecap="round"/>`;
  };
  const av=a0+(a1-a0)*Math.min(1,v/max);
  return `<svg width="${size}" height="${size*.82}" viewBox="0 0 ${size} ${size*.82}">
    ${arc(a0,a1,'#E6ECEF',11)}${arc(a0,av,col,11)}
    <text x="${c}" y="${c+6}" text-anchor="middle" font-size="30" font-weight="700" font-family="IBM Plex Sans Condensed" fill="${col}">${v}</text>
    <text x="${c}" y="${c+21}" text-anchor="middle" font-size="8" fill="#7C949F" font-family="IBM Plex Sans Condensed" letter-spacing=".14em">${label}</text></svg>`;
}
function waterfall(steps,{w=380,h=150}={}){
  const pl=6,pr=6,pt=12,pb=26,iw=w-pl-pr,ih=h-pt-pb;
  const vals=steps.map(s=>s.v); const mx=Math.max(...vals), mn=0, rg=mx-mn||1;
  const bw=iw/steps.length*.66, gap=iw/steps.length;
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block">${steps.map((s,i)=>{
    const bh=s.v/rg*ih, x=pl+gap*i+(gap-bw)/2, y=pt+ih-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${s.c}" rx="2"/>
    <text x="${(x+bw/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="10" font-family="IBM Plex Mono" fill="#0B1E2A">${s.v}</text>
    <text x="${(x+bw/2).toFixed(1)}" y="${h-13}" text-anchor="middle" font-size="8.5" fill="#7C949F">${esc(s.l)}</text>
    ${s.d?`<text x="${(x+bw/2).toFixed(1)}" y="${h-3}" text-anchor="middle" font-size="8.5" font-family="IBM Plex Mono" fill="${s.dc||'#12855A'}">${s.d}</text>`:''}`;
  }).join('')}</svg>`;

function hbars(items,{maxw=100}={}){

const BASEMAPS = {

         ref:'https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer'},

function basemapFrom(M,kind){

}
const LAYERS_OPEN = {
  imagery:{url:'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer',title:'World Imagery',src:'Living Atlas',item:'10df2279f9684e4a9f6a7f08febac2a9'},
  hillshade:{url:'https://services.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer',title:'World Hillshade',src:'Living Atlas',item:'90dd6371b5ba4685aaf8c94abcca099e'},
  hydro:{url:'https://services.arcgisonline.com/arcgis/rest/services/Reference/World_Hydro_Reference_Overlay/MapServer',title:'Hidrografia de referência',src:'Living Atlas',item:'World Hydro Reference Overlay'},
  boundaries:{url:'https://services.arcgisonline.com/arcgis/rest/services/Reference/World_Boundaries_and_Places/MapServer',title:'Limites e lugares',src:'Living Atlas',item:'World Boundaries and Places'},
  terrain3d:{url:'https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer',title:'Terrain3D',src:'Living Atlas',item:'Terrain3D'}
};
function esriReady(){
  return new Promise((res,rej)=>{
    if(ESRI.loaded) return res(ESRI.mods);
    if(typeof require==='undefined'){ mapFallback(); return rej(new Error('ArcGIS Maps SDK indisponível')); }
    require([
      'esri/Map','esri/views/MapView','esri/views/SceneView','esri/Basemap',
      'esri/layers/TileLayer','esri/layers/GraphicsLayer','esri/layers/FeatureLayer',
      'esri/Graphic','esri/geometry/Point','esri/geometry/Polygon','esri/geometry/Polyline',
      'esri/widgets/Legend','esri/widgets/Expand','esri/widgets/BasemapToggle','esri/widgets/Swipe',
      'esri/widgets/ScaleBar','esri/widgets/Search','esri/config'
    ], (Map,MapView,SceneView,Basemap,TileLayer,GraphicsLayer,FeatureLayer,Graphic,Point,Polygon,Polyline,Legend,Expand,BasemapToggle,Swipe,ScaleBar,Search,esriConfig)=>{
      ESRI.mods={Map,MapView,SceneView,Basemap,TileLayer,GraphicsLayer,FeatureLayer,Graphic,Point,Polygon,Polyline,Legend,Expand,BasemapToggle,Swipe,ScaleBar,Search,esriConfig};
      if(S.apiKey) esriConfig.apiKey = S.apiKey;
      ESRI.loaded=true; res(ESRI.mods);
    }, err=>{ mapFallback(); rej(err); });
  });
}
function destroyViews(){ ESRI.views.forEach(v=>{ try{ v.container=null; v.destroy(); }catch(e){} }); ESRI.views=[]; }

const SYM = {
  pt(color,size=9,outline='#ffffff'){ return {type:'simple-marker',style:'circle',color,size,outline:{color:outline,width:1.2}}; },
  sq(color,size=11){ return {type:'simple-marker',style:'square',color,size,outline:{color:'#fff',width:1.1}}; },
  tri(color,size=12){ return {type:'simple-marker',style:'triangle',color,size,outline:{color:'#fff',width:1.1}}; },
  fill(color,outline,wd=1.4){ return {type:'simple-fill',color,outline:{color:outline,width:wd}}; },
  line(color,wd=2,style='solid'){ return {type:'simple-line',color,width:wd,style}; }
};
function ringAround(lat,lng,rKm,n=48){
  const pts=[]; const dLat=rKm/110.57, dLng=rKm/(111.32*Math.cos(lat*Math.PI/180));
  for(let i=0;i<=n;i++){ const a=i/n*Math.PI*2; pts.push([lng+dLng*Math.cos(a), lat+dLat*Math.sin(a)]); }
  return pts;
}
/** Cria um mapa 2D no container com camadas do MINERA 360 */
function mapFallback(msg){
  $$('.map-loading').forEach(el=>{
    el.innerHTML = `<div style="text-align:center;max-width:340px">
      <div style="font-family:var(--f-cond);font-size:13px;font-weight:700;letter-spacing:.04em;margin-bottom:5px">MAPA INDISPONÍVEL NESTE AMBIENTE</div>
      <div class="tiny">${msg||'O ArcGIS Maps SDK for JavaScript é carregado pela CDN <span class="mono">js.arcgis.com</span>. Abra este arquivo em um navegador com acesso à internet para exibir os mapas 2D/3D e as camadas do Living Atlas.'}</div></div>`;
  });
}
async function makeMap(containerId, cfg={}){
  const M = await esriReady().catch(()=>null);
  if(!M) return null;
  const el = document.getElementById(containerId); if(!el) return null;
  const base = cfg.basemap || 'cinza';
  const map = new M.Map({basemap: basemapFrom(M, base), ground: cfg.ground? 'world-elevation': undefined});
  const registry = {};
  // camadas abertas / Living Atlas
  const opens = cfg.opens || ['hillshade','hydro'];
  opens.forEach(k=>{
    const L = LAYERS_OPEN[k]; if(!L) return;
    const tl = new M.TileLayer({url:L.url, title:L.title, opacity: k==='hillshade'?0.4: k==='imagery'?1:0.75, visible: cfg.visible? cfg.visible.includes(k):true});
    tl.when(null, ()=>console.warn('Camada indisponível:',L.title));
    registry[k]=tl; map.add(tl);
  });
  const groups = ['proc','zas','rede','com','sens','eq','alertas','ops','pulse'];
  groups.forEach(g=>{ const L=new M.GraphicsLayer({title:g}); registry[g]=L; map.add(L); });
  const gl = registry.ops;
  const view = new M.MapView({
    container: el, map,
    center: cfg.center || [-42.2,-19.55], zoom: cfg.zoom || 8,
    constraints:{snapToZoom:false}, ui:{components:['zoom','attribution']},
    popup:{dockEnabled:false, collapseEnabled:false}
  });
  ESRI.views.push(view);
  view.when(()=>{ const ld=el.parentElement.querySelector('.map-loading'); if(ld) ld.remove(); });
  view.ui.add(new M.ScaleBar({view, unit:'metric', style:'line'}),'bottom-right');
  return {view, map, layers:registry, M, gl};
}
/** Desenha estruturas como grafismos com halo de status */
function drawEstruturas(ctx, list, opts={}){
  const {M,gl} = ctx;
  gl.removeAll(); ctx.gfx = {};
  list.forEach(e=>{
    const col = ST_COLOR[e.status];
    if(e.risk>=55 || opts.allHalo){
      gl.add(new M.Graphic({
        geometry:new M.Polygon({rings:[ringAround(e.lat,e.lng, e.risk>=73?4.2:2.4)]}),
        symbol:SYM.fill([...hex2rgb(col),0.13], [...hex2rgb(col),0.5],1)
      }));
    }
    const sym = e.tipo==='barragem'? SYM.tri(col, e.risk>=73?15:12)
              : e.tipo==='pilha'? SYM.sq(col,10)
              : e.tipo==='cava'? SYM.pt(col,9)
              : SYM.pt(col,7,'#42606F');
    const g = new M.Graphic({
      geometry:new M.Point({longitude:e.lng, latitude:e.lat}),
      symbol:sym, attributes:{id:e.id,nome:e.nome,tipo:e.tipo,status:ST_LABEL[e.status],risk:e.risk,operador:e.operador,municipio:e.municipio+'/'+e.uf,pop:e.popZAS,nc:e.ncAbertas,fisc:e.ultimaFisc},

        {fieldName:'pop',label:'População em ZAS'},{fieldName:'nc',label:'NC abertas'},{fieldName:'fisc',label:'Dias desde a última fiscalização'}]}]}
    });
    gl.add(g); ctx.gfx[e.id]=g;
  });

    ctx._clickBound = true;

    });
  }

/* ---------- adensamento territorial: processos, ZAS, comunidades, sensores, equipes, alertas ---------- */
function polyAround(lat,lng,rKm,sides,rot=0,irr=0.25){
  const pts=[]; const dLat=rKm/110.57, dLng=rKm/(111.32*Math.cos(lat*Math.PI/180));
  for(let i=0;i<=sides;i++){ const a=rot+i/sides*Math.PI*2; const k=1+(Math.sin(i*2.7+rot*9)*irr);
    pts.push([lng+dLng*Math.cos(a)*k, lat+dLat*Math.sin(a)*k]); }
  return pts;
}

/* halo pulsante quando um agente atua sobre uma estrutura */
function pulseOnMap(estruturaId,color='#6D3FBF'){
  const e=byId(estruturaId); if(!e) return;
  Object.values(MAPS).forEach(ctx=>{
    if(!ctx||!ctx.layers||!ctx.layers.pulse||!ctx.M) return;
    const M=ctx.M, L=ctx.layers.pulse;
    let r=0.6;
    const g=new M.Graphic({geometry:new M.Polygon({rings:[ringAround(e.lat,e.lng,r)]}),
      symbol:SYM.fill([...hex2rgb(color),0.20],[...hex2rgb(color),0.85],2)});
    L.add(g);
    let step=0;
    const iv=setInterval(()=>{
      step++; r+=1.1;
      try{
        g.geometry=new M.Polygon({rings:[ringAround(e.lat,e.lng,r)]});
        g.symbol=SYM.fill([...hex2rgb(color),Math.max(0,0.20-step*0.03)],[...hex2rgb(color),Math.max(0,0.85-step*0.13)],2);
      }catch(err){}
      if(step>6){ clearInterval(iv); try{L.remove(g)}catch(err){} }
    },170);
  });
}
/* atualiza o símbolo de uma estrutura no mapa sem redesenhar tudo */
function refreshStructureSymbol(id){
  const e=byId(id); if(!e) return;
  Object.values(MAPS).forEach(ctx=>{
    if(!ctx||!ctx.gfx||!ctx.gfx[id]) return;
    const col=ST_COLOR[e.status];
    const sym = e.tipo==='barragem'? SYM.tri(col, e.risk>=73?15:12)
              : e.tipo==='pilha'? SYM.sq(col,10)
              : e.tipo==='cava'? SYM.pt(col,9) : SYM.pt(col,7,'#42606F');
    ctx.gfx[id].symbol=sym;
    const a=ctx.gfx[id].attributes; if(a){ a.status=ST_LABEL[e.status]; a.risk=e.risk; }
  });
}

/* ============================================================
   MOTOR DE AGENTES EM TEMPO REAL
   Agentes executam continuamente: cada run avança passo a passo,
   produz resultado, altera o estado compartilhado e, quando o
   caso exige, para na fila de decisão humana.
   ============================================================ */
const RUNS = [];              // execuções (ativas e concluídas)
let runSeq = 498831;
const MAX_CONCURRENT = 4;

const T = {                   // formatadores de linha de log
  ok:(s)=>`<span class="ok">${s}</span>`,
  wr:(s)=>`<span class="wr">${s}</span>`,
  er:(s)=>`<span class="er">${s}</span>`,
  hl:(s)=>`<span class="hl">${s}</span>`
};
function stampNow(){ return hhmmss(new Date()); }

/* ---------- roteiros por agente ---------- */
const STEPS = {
  risk:(e)=>{ const d=ri(-6,12); return {
    steps:[`evento recebido — sensor.threshold.exceeded`,`estrutura identificada ${T.hl(e.id)}`,
      `telemetria consultada (${e.sensores} sensores)`,`chuva consultada — ${ri(12,132)} mm/24 h`,
      `deslocamento InSAR consultado — ${fmt1(rnd()*8)} mm`,`população em ZAS consultada — ${fmt(e.popZAS)}`,
      `risk model executado — risk-dyn-v6.1`,
      `score ${e.risk} → ${T[d>0?'er':'ok'](String(Math.max(4,Math.min(97,e.risk+d))))} · confiança ${T.ok('91%')}`],
    apply:()=>{ e.riskPrev=e.risk; e.risk=Math.max(4,Math.min(97,e.risk+d)); e.trend=e.risk-e.riskPrev;
      e.status = e.risk>=75?'critico':e.risk>=58?'alerta':e.risk>=45?'atencao':'normal';
      refreshStructureSymbol(e.id);
      if(Math.abs(d)>=8) pushEvent(d>0?'critico':'normal',`Risk Score de ${e.id} recalculado: ${e.riskPrev} → ${e.risk}`,'risk.score.changed',e.id); },
    result: d>0? `risco elevado em ${d} pontos` : `risco reduzido em ${Math.abs(d)} pontos`,
    decision: e.risk>=80? {sev:'critico',ttl:`${e.id} — elevar status para CRÍTICO`,rec:'Recomendação do Risk Agent após recálculo dinâmico com três fontes independentes.',conf:ri(86,94),acts:[['Analisar','openDecision']],ref:e.id} : null };
  },
  observador:(e)=>{ const a=+(rnd()*3.2+0.2).toFixed(2), dec = rnd()<.42;
    return {steps:[`imagem adquirida — Sentinel-2 · ${ri(0,9)}% de nuvem`,`cloud mask aplicada`,
      `change detection sobre ${T.hl(e.id)}`,`polígono identificado — ${fmt2(a)} ha`,
      `cruzamento SIGMINE — processo ${800+ri(0,99)}.${pad(ri(1,999))}/20${ri(10,24)}`,`cruzamento com licença ambiental`,
      dec? `declaração localizada no SIDOM ${T.ok('OK')}` : `nenhuma declaração localizada ${T.wr('DIVERGÊNCIA')}`,
      `confiança GeoAI ${T.ok(ri(78,97)+'%')}`],
      apply:()=>{ if(!dec) pushEvent('alerta',`Mudança observada em ${e.id} sem declaração correspondente (${fmt2(a)} ha)`,'imagery.change.detected',e.id); },
      result: dec? 'mudança declarada e coerente' : `divergência de ${fmt2(a)} ha sem declaração`,
      decision: (!dec && a>1.2)? {sev:'alerta',ttl:`${e.id} — determinar fiscalização remota`,rec:`Expansão de ${fmt2(a)} ha observada por satélite sem declaração correspondente.`,conf:ri(84,95),acts:[['Aprovar missão','approveMission']],ref:e.id}:null };
  },
  contrato:(e)=>{ const bad=rnd()<.3;
    return {steps:[`lote recebido — ${fmt(ri(800,4200))} leituras · gateway GW-${pad(ri(1,42),2)}`,
      `schema ${T.ok('OK')} · unidades ${T.ok('OK')}`,
      bad? `frequência declarada 1 min · observada ${ri(3,9)} min ${T.wr('DESVIO')}` : `frequência conforme ${T.ok('OK')}`,
      bad? `timestamp fora de ordem em ${ri(3,40)} registros ${T.wr('AVISO')}` : `timestamps consistentes ${T.ok('OK')}`,
      `identidade do dispositivo verificada`,
      bad? `ação: ${T.hl('lote marcado como suspeito')}` : `lote aceito e encaminhado ao Data Fabric`],
      apply:()=>{ if(bad) pushEvent('atencao',`Contrato de dados violado no lote de ${e.id} — retransmissão solicitada`,'data.contract.violation',e.id); },
      result: bad? 'quebra de contrato — retransmissão solicitada' : 'lote íntegro e aceito' };
  },
  health:(e)=>{ const s=pick(DB.sensores.filter(x=>x.estruturaId===e.id))||pick(DB.sensores);
    const bad=rnd()<.28;
    return {steps:[`série do sensor ${T.hl(s.sid)} carregada (${s.serie.length} pontos)`,
      `teste de congelamento ${bad?T.wr('SUSPEITO'):T.ok('OK')}`,`teste de drift ${T.ok('OK')}`,
      `repetição artificial ${T.ok('OK')}`,`calibração válida até ${dmy(s.calibracao)}`,
      `health score ${bad?T.wr(ri(28,58)+'%'):T.ok(s.health+'%')}`],
      apply:()=>{ if(bad){ s.status='semdados'; pushEvent('atencao',`Sensor ${s.sid} de ${e.id} marcado como suspeito pelo agente de saúde`,'sensor.health',e.id);} },
      result: bad? `sensor ${s.sid} marcado como suspeito` : `sensor ${s.sid} íntegro` };
  },
  quality:()=>{ const ds=pick(DB.datasets);
    return {steps:[`varredura do dataset ${T.hl(ds.id)} — ${ds.nome}`,`${ri(40,220)} regras executadas`,
      `completude ${ds.completude}% · atualidade ${ds.atualidade}%`,
      ds.qualidade<92? `atualidade fora do SLA ${T.wr('PENDÊNCIA')}` : `SLA cumprido ${T.ok('OK')}`,
      `índice consolidado ${T.hl(ds.qualidade+'%')}`],
      result:`qualidade de ${ds.id} em ${ds.qualidade}%` };
  },
  regtech:(e)=>{ const n=pick(DB.ncs), venc=rnd()<.35;
    return {steps:[`evento com efeito normativo recebido`,`ativo localizado — ${T.hl(e.id)}`,
      `${ri(3,9)} obrigações aplicáveis identificadas`,`vigência confirmada · exceções verificadas`,
      venc? `prazo de ${n.id} expirado ${T.er('NÃO CONFORMIDADE')}` : `obrigações conformes ${T.ok('OK')}`,
      `regra aplicável ${T.hl(pick(DB.regras).id)}`,
      venc? `caso REG-${ri(1100,1299)} criado — requer validação técnica` : `nenhum caso aberto`],
      apply:()=>{ if(venc) pushEvent('alerta',`Possível não conformidade identificada em ${e.id} — requer validação técnica`,'nonconformity.created',e.id); },
      result: venc? 'possível não conformidade identificada' : 'situação regulatória conforme' };
  },
  evidence:()=>{ const ev=pick(DB.evidencias);
    return {steps:[`evidência ${T.hl(ev.id)} recebida (${ev.tipo.toLowerCase()})`,
      `coordenada presente ${T.ok('OK')} · precisão ±${ri(2,8)} m`,`timestamp coerente ${T.ok('OK')}`,
      `device ID reconhecido no registro ${T.ok('OK')}`,`hash SHA-256 calculado — ${ev.sha.slice(0,4)}…${ev.sha.slice(-3)}`,
      `ancoragem no ledger — bloco ${T.hl('#'+ev.bloco)}`],
      apply:()=>{ pushEvent('normal',`Evidência ${ev.id} assinada e ancorada no bloco #${ev.bloco}`,'evidence.anchored',ev.estruturaId); },
      result:`${ev.id} íntegra e ancorada` };
  },
  fiscal:(e)=>({steps:[`caso recebido — origem ${pick(['risco dinâmico','divergência GeoAI','NC reincidente','denúncia'])}`,
      `${AGG.fiscAbertas} casos abertos reavaliados`,`variáveis: risco, impacto, reincidência, tempo sem inspeção`,
      `${T.hl(e.id)} posicionado em ${pad(ri(1,12),2)}º na fila (score ${ri(62,98)})`,
      `capacidade: ${DB.equipes.filter(x=>x.situacao==='Disponível').length} equipes disponíveis`,
      `rascunho de missão F-${ri(1250,1299)} montado`],
      result:'rascunho de missão gerado — aguarda autorização',
      decision:{sev:'alerta',ttl:`${e.id} — autorizar fiscalização`,rec:'Missão pré-montada pelo Agente de Fiscalização com equipe, rota e evidências obrigatórias.',conf:ri(82,94),acts:[['Aprovar missão','approveMission']],ref:e.id}}),
  nc:()=>{ const n=pick(DB.ncs.filter(x=>x.status!=='Corrigida'))||DB.ncs[0];
    return {steps:[`verificação de prazo — ${T.hl(n.id)}`,`prazo ${dmy(n.prazo)}`,
      `evidências recebidas: ${n.evidenciasRecebidas}`,
      n.status==='Atrasada'? `evidência ${T.er('INSUFICIENTE')} · prazo vencido` : `tratamento em curso ${T.ok('OK')}`,
      n.reincidencia? `reincidência confirmada ${T.wr('AGRAVANTE')}` : `sem reincidência`,
      n.status==='Atrasada'? `ação: ${T.hl('cobrança e escalonamento')}` : `ação: acompanhamento`],
      result: n.status==='Atrasada'? `${n.id} escalonada` : `${n.id} em acompanhamento` };
  },
  orq:(e)=>({steps:[`evento recebido — ${pick(['sensor.threshold.exceeded','imagery.change.detected','deadline.expired','rain.extreme'])}`,
      `contexto resolvido — ${T.hl(e.id)} / ${e.empId} / ${e.municipio}`,
      `deduplicação: ${ri(1,5)} eventos correlatos agrupados`,
      `despacho → Data Quality · Risk Agent · Digital Twin`,
      `respostas consolidadas em ${fmt1(rnd()*4+0.8)} s`,
      `cadeia encerrada em ponto de decisão rastreável`],
      apply:()=>{ pulseOnMap(e.id,'#6D3FBF'); },
      result:`${ri(3,7)} agentes coordenados` }),
  gemeo:(e)=>({steps:[`evento de estado recebido para ${T.hl(e.id)}`,`identidade única confirmada`,
      `instrumentos íntegros ${e.sensoresOk}/${e.sensores}`,`geometria e atributos atualizados ${T.ok('OK')}`,
      `propagado para CCO e Risk Engine`,`novo estado: ${T.hl(ST_LABEL[e.status].toUpperCase())}`],
      apply:()=>{ refreshStructureSymbol(e.id); }, result:`gêmeo de ${e.id} sincronizado` }),
  prazos:()=>({steps:[`varredura do relógio institucional`,`${fmt(ri(1800,2500))} obrigações verificadas`,
      `${ri(30,110)} vencem nos próximos 7 dias`,`${ri(60,100)} vencidas`,`notificações preparadas`,
      `${T.hl(ri(3,14)+' escalonamentos')} sugeridos`], result:'monitoramento de prazos atualizado' }),
  mrv:()=>({steps:[`verificação de indicador do Anexo 14`,`linha de base localizada`,
      `meta do período confrontada com o realizado`,`evidências vinculadas ${T.ok('OK')}`,
      `consistência financeira-territorial ${T.ok('OK')}`,`resultado ${T.hl('VERIFICADO')} — aguarda publicação`],
      result:'indicador verificado — aguarda autorização humana' }),
  cenario:(e)=>({steps:[`cenário severo solicitado para ${T.hl(e.id)}`,`malha 10 m · ${fmt(ri(2800,6400))} células`,
      `propagação simulada`,`população exposta ${fmt(ri(900,12000))}`,
      `primeira comunidade em ${ri(9,42)} min`,`gap de evacuação ${T.wr(ri(0,14)+' min')}`],
      result:'simulação concluída' }),
  situacional:(e)=>({steps:[`mudanças das últimas 2 h consolidadas`,`${ri(4,18)} eventos relevantes`,
      `estruturas afetadas: ${T.hl(e.id)} e outras ${ri(0,4)}`,`exposição recalculada`,
      `resumo situacional publicado ao CCO`], result:'consciência situacional atualizada' }),
  protecao:()=>({steps:[`pedido de publicação recebido`,`varredura de dado pessoal e sensível`,
      `${ri(20,140)} campos com restrição identificados`,`${T.er('bloqueio')} aplicado aos campos restritos`,
      `conteúdo liberado para linguagem cidadã`], result:'publicação filtrada e liberada' })
};
function genericSteps(a,e){
  return {steps:[`gatilho: ${a.trigger.toLowerCase()}`,`objeto: ${T.hl(e.id)}`,
    `analisando ${a.analisa.toLowerCase()}`,`regras e modelo ${a.modelo} aplicados`,
    `ação executada: ${a.executa.toLowerCase()}`,`confiança ${T.ok(a.acuracia+'%')}`],
    result:a.executa.toLowerCase()};
}

/* ---------- ciclo de vida das execuções ---------- */
function spawnRun(){
  const ativos = RUNS.filter(r=>r.status==='running');
  if(ativos.length>=MAX_CONCURRENT) return;
  const a = pickw([
    ['risk',9],['observador',7],['contrato',10],['health',7],['quality',8],['regtech',6],
    ['evidence',7],['fiscal',5],['nc',5],['orq',9],['gemeo',7],['prazos',4],['mrv',2],
    ['cenario',2],['situacional',3],['protecao',2],
    [pick(DB.agentes).id,6]
  ].map(x=>[x[0],x[1]]));
  const ag = agentById(a) || DB.agentes[0];
  const e = pickw([['B-017',3],[pick(DB.estruturas).id,10]]);
  const est = byId(e) || DB.estruturas[0];
  const tpl = (STEPS[ag.id]? STEPS[ag.id](est) : genericSteps(ag,est));
  const run = {
    id:++runSeq, agent:ag, obj:est.id, ts:new Date(), status:'running', i:0,
    steps:tpl.steps, lines:[], apply:tpl.apply, result:tpl.result, decision:tpl.decision||null,
    conf: ri(Math.max(70,ag.acuracia-8), Math.min(99,ag.acuracia+3))
  };
  RUNS.unshift(run);
  if(RUNS.length>60) RUNS.pop();
  ag.status='executando'; ag.ultimaAcao=0;
  return run;
}
function advanceRuns(){
  RUNS.filter(r=>r.status==='running').forEach(r=>{
    const line = r.steps[r.i];
    r.lines.push({t:stampNow(), s:line, run:r.id, ag:r.agent.nome});
    STREAM.unshift({t:stampNow(), ag:r.agent, run:r.id, s:line, obj:r.obj});
    r.i++;
    if(r.i>=r.steps.length){
      r.status='done'; r.fim=new Date();
      r.agent.runs++; r.agent.status='ativo'; r.agent.ultimaAcao=0;
      try{ r.apply && r.apply(); }catch(err){}
      STREAM.unshift({t:stampNow(), ag:r.agent, run:r.id, s:`concluído — ${T.hl(r.result)} · confiança ${T.ok(r.conf+'%')}`, obj:r.obj, done:true});
      if(r.decision && S.decisions.length<10 && Math.random()<.22){
        r.decision.id='D-'+r.id; S.decisions.unshift(r.decision);
        toast('Nova decisão na fila', r.decision.ttl+' — recomendada por '+r.agent.nome+'.','ai',5200);
      }
      if(Math.random()<.35) pulseOnMap(r.obj, '#6D3FBF');
    }
  });
  if(STREAM.length>220) STREAM.length=220;
  DB.agentes.forEach(a=>{ if(a.status==='ativo') a.ultimaAcao += 2; });
}
const STREAM = [];

/* ---------- superfícies vivas ---------- */
function agentStreamHTML(limit=26){
  return STREAM.slice(0,limit).map(l=>
    `<div><span class="t">${l.t}</span> <span style="color:#8FA9FF">${esc(l.ag.nome)}</span> <span class="t">#${l.run}</span> ${l.s}</div>`
  ).join('') || '<div class="t">aguardando eventos…</div>';
}
function agentRailHTML(limit=8){
  const ativos = RUNS.filter(r=>r.status==='running');
  const list = ativos.concat(RUNS.filter(r=>r.status==='done').slice(0,limit-ativos.length));
  return list.slice(0,limit).map(r=>`
    <div class="ag ${r.status==='running'?'busy':''}" data-act="openAgent" data-id="${r.agent.id}">
      <span class="ic">${r.agent.ic}</span>
      <div style="flex:1;min-width:0"><div class="nm">${esc(r.agent.nome)}</div>
        <div class="ls">${r.status==='running'? esc(String(r.steps[Math.max(0,r.i-1)]).replace(/<[^>]+>/g,'')).slice(0,54) : esc(r.result).slice(0,54)}</div></div>
      <div style="flex:0 0 auto;text-align:right">
        ${r.status==='running'
          ? `<span class="st ai sq">executando</span><div class="ls">${r.i}/${r.steps.length}</div>`
          : `<span class="st normal sq">concluído</span><div class="ls">${r.conf}%</div>`}
      </div></div>`).join('') || '<div class="empty">Nenhuma execução no momento.</div>';
}
function agentRunsTableHTML(limit=14){
  return RUNS.slice(0,limit).map(r=>`<tr data-act="openAgent" data-id="${r.agent.id}">
    <td class="mono">#${r.id}</td><td><b>${r.agent.ic} ${esc(r.agent.nome)}</b></td>
    <td class="mono">${r.obj}</td><td class="mono tiny">${hhmmss(r.ts)}</td>
    <td class="tiny">${r.status==='running'? '<span class="muted">'+esc(String(r.steps[Math.max(0,r.i-1)]).replace(/<[^>]+>/g,'')).slice(0,46)+'…</span>' : esc(r.result)}</td>
    <td>${r.status==='running'? '<span class="st ai sq">executando</span>':'<span class="st normal sq">concluído</span>'}</td>
    <td class="num">${r.status==='running'? '—' : r.conf+'%'}</td></tr>`).join('');
}
function updateLiveAgents(){
  const st=$('#agStream'); if(st) st.innerHTML=agentStreamHTML();
  const rail=$('#agRail'); if(rail) rail.innerHTML=agentRailHTML();
  const rail2=$('#agRailMini'); if(rail2) rail2.innerHTML=agentRailHTML(5);
  const tb=$('#agRunsBody'); if(tb) tb.innerHTML=agentRunsTableHTML();
  const cnt=$('#agCounter'); if(cnt){
    const n=RUNS.filter(r=>r.status==='running').length;
    cnt.innerHTML = `<span class="mv">${n}</span> em execução · <span class="mv">${fmt(DB.agentes.reduce((s,a)=>s+a.runs,0))}</span> runs`;
  }
  const dq=$('#dq'); if(dq) dq.innerHTML=decisionList();
  const badge=$('#decBadge'); if(badge) badge.textContent=S.decisions.length;
  // lista do Centro de Agentes
  $$('[data-aglive]').forEach(el=>{
    const a=agentById(el.dataset.aglive); if(!a) return;
    const busy = RUNS.some(r=>r.status==='running'&&r.agent.id===a.id);
    el.classList.toggle('busy',busy);
    const s=el.querySelector('[data-agst]'); if(s) s.innerHTML = busy? '<span class="st ai sq">executando</span>':'<span class="st normal sq">ativo</span>';
    const t=el.querySelector('[data-agtime]'); if(t) t.textContent = busy? 'agora' : 'há '+(a.ultimaAcao<60? a.ultimaAcao+' s' : Math.round(a.ultimaAcao/60)+' min');
    const r=el.querySelector('[data-agruns]'); if(r) r.textContent=fmt(a.runs);
  });
}
let agentHandle=null;
function startAgents(){
  if(agentHandle) clearInterval(agentHandle);
  // preenche o histórico para a tela nunca nascer vazia
  for(let i=0;i<9;i++){ const r=spawnRun(); if(r){ while(r.i<r.steps.length) { r.lines.push({}); r.i++; }
    r.status='done'; r.fim=new Date(); r.agent.runs++;
    STREAM.push({t:hhmmss(new Date(Date.now()-i*9000)), ag:r.agent, run:r.id, s:`concluído — ${T.hl(r.result)}`, obj:r.obj, done:true}); } }
  agentHandle = setInterval(()=>{
    if(!S.live) return;
    advanceRuns();
    if(Math.random()<.72) spawnRun();
    updateLiveAgents();
  }, 2000);
}

function pushEvent(sev,txt,tipo,ref){
  const e={id:'E'+Date.now()+Math.floor(Math.random()*99),sev,txt,tipo,ref,ts:new Date(),fresh:true};
  DB.eventos.unshift(e);
  if(DB.eventos.length>400) DB.eventos.pop();
  S.eventCount++; S.lastUpdate=new Date();
  const feed=$('#feedTorre');
  if(feed) feed.innerHTML = eventFeed(DB.eventos);
  const lu=$('#lastup'); if(lu) lu.textContent=hhmmss(S.lastUpdate);
  setTimeout(()=>{e.fresh=false;},1500);
  BUS.emit('event',e);
  return e;
}
function updateTicker(){
  const t=$('#ticker'); if(!t) return;
  const items = DB.eventos.slice(0,8).map(e=>`<span>${hhmmss(e.ts)} · ${esc(e.txt)}</span>`).join('');
  t.innerHTML = items+items;
}

let tickHandle=null;
function startSimulator(){
  if(tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(()=>{
    if(!S.live || S.mode!=='LIVE') return;

    const n = Math.random()<.3?2:1;
    for(let i=0;i<n;i++){
      const t = EV_TEMPLATES[Math.floor(Math.random()*EV_TEMPLATES.length)]();

    // telemetria da tabela live
    $$('#liveTable tbody tr').forEach(tr=>{

      const cv=tr.querySelector('[data-val]'); if(cv) cv.innerHTML=`${fmt2(s.valor)} <span class="muted">${s.unidade}</span>`;

      $$('.chain-s').forEach((el,k)=>el.classList.toggle('hot',k===i)); S.chainHot=i; }

}

function nextDemoStep(){
  S.demo.step++;
  if(S.demo.step>=DEMO_SCRIPT.length){ stopDemo(); return; }
  const st=DEMO_SCRIPT[S.demo.step];

  if(st.t===6){ b.risk=78; b.riskPrev=67; b.trend=11; b.status='alerta'; }
  if(st.t===7){ b.status='critico'; }
  if(st.t===14){ b.risk=46; b.riskPrev=78; b.trend=-32; b.status='atencao'; }

  S.sel='B-017'; S.selType='estrutura';
  navigate(st.mod);
  pushEvent(st.sev,st.txt,st.tipo,st.ref);
  showDemoNote(st);
}

ACT.openMRV = ()=>{ ACT.closeModal(); S.tab.mrv='ind'; navigate('mrv'); };
ACT.openKey = ()=>{
  modal('Chave da API ArcGIS', `<div style="font-size:12.5px;line-height:1.6">
    Este mockup usa o <b>ArcGIS Maps SDK for JavaScript 4.30</b> e funciona sem chave, com o basemap OpenStreetMap e camadas abertas do Living Atlas (World Imagery, World Hillshade, hidrografia de referência e Terrain3D).
    <div style="margin-top:11px">Informe uma chave para habilitar os basemaps Esri, os serviços Sentinel-2 e as camadas do Living Atlas que exigem autenticação. A chave fica <b>apenas na sessão deste navegador</b> — o mockup nunca a embute no código nem a envia a outro servidor.</div>
    <div class="fld" style="margin-top:13px"><label>ArcGIS API key</label>
      <input id="apikey" type="password" placeholder="AAPK…" value="${esc(S.apiKey)}" class="mono"></div>
    <div style="margin-top:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px">
      <span class="lbl">Em produção</span>
      <div class="mono tiny" style="margin-top:4px">VITE_ARCGIS_API_KEY=&lt;ESRI_API_KEY&gt;</div>
      <div class="tiny muted" style="margin-top:4px">A chave é injetada por variável de ambiente e servida por um proxy autenticado, com escopo e referrer restritos. Nunca versionada no repositório.</div></div>
    </div>`,
  {size:'sm',footer:`<button class="btn" data-act="closeModal">Cancelar</button><button class="btn p" data-act="saveKey">Aplicar chave</button>`});
};
ACT.saveKey = ()=>{
  const v=$('#apikey'); S.apiKey = v? v.value.trim() : '';
  if(ESRI.mods && S.apiKey) ESRI.mods.esriConfig.apiKey = S.apiKey;
  ACT.closeModal();
  toast(S.apiKey?'Chave aplicada':'Chave removida', S.apiKey? 'Basemaps Esri e serviços autenticados habilitados nesta sessão.':'O mockup segue funcionando com camadas abertas.','ok');
  navigate(S.module);
};
ACT.exportReport = d=>{
  const k=d.k||'relatorio';
  toast('Relatório em geração','“'+k+'” será exportado com o recorte, os filtros e o horário atuais, e o arquivo recebe hash de integridade.','ok');
  setTimeout(()=>toast('Relatório pronto','Documento assinado e disponível para download. Hash registrado na trilha de auditoria.','ok'),1600);
};

/* ============================================================
   REPLAY
   ============================================================ */
BUS.on('select',()=>{});
function replayBar(){
  if(S.mode!=='REPLAY') return '';
  return `<div style="padding:10px 18px 0"><div class="replay">
    <b style="font-family:var(--f-cond);letter-spacing:.08em">REPLAY · INC-014</b>
    <span class="mono">11 AGO 18:00</span>
    <input type="range" min="0" max="180" value="${S.replayT}" data-inp="replaySeek">
    <span class="mono">21:00</span>
    <b class="mono" id="replayClock" style="color:#4FD1C5">19:27</b>
    <button class="btn sm" style="background:#16303F;border-color:#1E3A4C;color:#E7EFF3" data-act="approveGeneric">▶ Reproduzir</button>
    <span class="tiny" style="color:#8FAAB9">velocidade 4×</span>
  </div></div>`;
}
ACT.replaySeek = (d,t)=>{
  const min=+t.value; const h=18+Math.floor(min/60), m=min%60;
  const c=$('#replayClock'); if(c) c.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  S.replayT=min;
};

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); ACT.openAI(); }
  if(e.key==='Escape') ACT.closeModal();
});
window.addEventListener('hashchange',()=>{
  const m=location.hash.replace('#',''); if(MODULES[m] && m!==S.module) navigate(m);
});
(function init(){
  const m=location.hash.replace('#','');
  if(MODULES[m]) S.module=m;
  render();
  startSimulator();
  startAgents();
  updateLiveAgents();
  updateTicker();
  setTimeout(()=>{
    toast('MINERA 360 — ambiente de demonstração',
      'Dados sintéticos da bacia do Rio Doce. Use “Iniciar cenário demo” para percorrer o fluxo ponta a ponta da Barragem B-017 em cerca de 4 minutos.','ai',9000);
  },1200);
})();

</script>
